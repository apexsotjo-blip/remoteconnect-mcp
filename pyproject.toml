[project]
name = "remoteconnect-mcp"
version = "0.20.0"
description = "MCP server for Schneider Electric RemoteConnect and SCADAPack x70 logic projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "pywin32>=306; sys_platform == 'win32'",
    "pymodbus>=3.5,<4",
    "lxml>=5.0",
    "xlrd>=2.0,<3",
    "xlutils>=2.0,<3",
]

[project.scripts]
remoteconnect-mcp = "remoteconnect_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remoteconnect_mcp = ["native/*.cs", "ffb_catalog.json"]
